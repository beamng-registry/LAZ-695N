name: Build reference package

on:
  workflow_dispatch:

jobs:
  build-reference-package:
    runs-on: ubuntu-latest
    env:
      REFERENCE_ARCHIVE_URL: https://github.com/beamng-registry/LAZ-695N/releases/download/v0.0.0/LAZ695ref.7z
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download reference archive
        run: curl -fL "$REFERENCE_ARCHIVE_URL" -o "$RUNNER_TEMP/LAZ695ref.7z"

      - name: Extract reference archive
        env:
          REFERENCE_PACKAGE_PASSWORD: ${{ secrets.REFERENCE_PACKAGE_PASSWORD }}
        run: |
          if [ -z "$REFERENCE_PACKAGE_PASSWORD" ]; then
            echo "REFERENCE_PACKAGE_PASSWORD secret is required" >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/reference-package"
          7z x "$RUNNER_TEMP/LAZ695ref.7z" "-o$RUNNER_TEMP/reference-package" "-p$REFERENCE_PACKAGE_PASSWORD"

      - name: Replace LAZ695N Lua scripts
        run: |
          rm -rf "$RUNNER_TEMP/reference-package/vehicles/LAZ695N/lua"
          mkdir -p "$RUNNER_TEMP/reference-package/vehicles/LAZ695N"
          cp -R "$GITHUB_WORKSPACE/vehicles/LAZ695N/lua" "$RUNNER_TEMP/reference-package/vehicles/LAZ695N/lua"

      - name: Create zip archive
        run: |
          cd "$RUNNER_TEMP/reference-package"
          zip -r "$RUNNER_TEMP/LAZ695ref.zip" .

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: LAZ695ref
          path: ${{ runner.temp }}/LAZ695ref.zip
          if-no-files-found: error
